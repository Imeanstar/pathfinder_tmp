<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AJOU Pathfinder 기술 스택 다이어그램</title>
  <desc id="desc">웹 프론트엔드에서 FastAPI 서버로 요청이 전달되고, 개인정보 보호 입력 파이프라인, Gemini, LangGraph, TF-IDF RAG, 공식 교내 데이터가 졸업 현황과 학기별 로드맵 대시보드를 생성하는 구조.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2A4A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1,1 L10,5.5 L1,10 Z" fill="#477AAE"/>
    </marker>
    <marker id="arrowSoft" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1,1 L10,5.5 L1,10 Z" fill="#9BB4CB"/>
    </marker>
    <style>
      .group { fill: #FFFFFF; stroke: #DCE7F1; stroke-width: 2; }
      .group-label { font: 700 22px Arial, 'Malgun Gothic', sans-serif; letter-spacing: 1.4px; }
      .node { fill: #FFFFFF; stroke: #DDE7F0; stroke-width: 2; filter: url(#shadow); }
      .node-label { fill: #17324D; font: 700 25px Arial, 'Malgun Gothic', sans-serif; text-anchor: middle; }
      .node-sub { fill: #687D93; font: 500 18px Arial, 'Malgun Gothic', sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #477AAE; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #9BB4CB; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 9; marker-end: url(#arrowSoft); }
      .mini-label { fill: #FFFFFF; font: 700 17px Arial, 'Malgun Gothic', sans-serif; letter-spacing: .6px; }
      .data-label { fill: #2B6F50; font: 700 21px Arial, 'Malgun Gothic', sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F8FBFE"/>
  <text x="86" y="92" fill="#1C62AC" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="28" font-weight="700" letter-spacing="3">AJOU PATHFINDER</text>
  <text x="86" y="140" fill="#17324D" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="42" font-weight="700">Technology Stack</text>
  <line x1="86" y1="169" x2="1834" y2="169" stroke="#DCE7F1" stroke-width="2"/>

  <!-- Group containers -->
  <rect class="group" x="80" y="222" width="252" height="630" rx="22"/>
  <rect class="group" x="366" y="222" width="330" height="630" rx="22"/>
  <rect class="group" x="730" y="222" width="312" height="630" rx="22"/>
  <rect class="group" x="1076" y="222" width="390" height="630" rx="22"/>
  <rect class="group" x="1500" y="222" width="252" height="630" rx="22"/>
  <rect class="group" x="1760" y="222" width="130" height="630" rx="22"/>

  <!-- Group headers -->
  <rect x="104" y="245" width="202" height="40" rx="20" fill="#EAF3FF"/>
