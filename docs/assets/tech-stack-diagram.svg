  <rect x="390" y="245" width="282" height="40" rx="20" fill="#FFF0F0"/>
  <text class="group-label" x="531" y="273" text-anchor="middle" fill="#B74848">SAFE INPUT</text>
  <rect x="754" y="245" width="264" height="40" rx="20" fill="#EAF3FF"/>
  <text class="group-label" x="886" y="273" text-anchor="middle" fill="#1C62AC">BACKEND</text>
