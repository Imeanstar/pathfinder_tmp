template: |
  다음은 학생이 진로·졸업 상담 챗봇에게 한 질문이다. 이 질문을
  요람 조항·과목 카탈로그·교내 프로그램 목록에서 검색하기 좋은 핵심 키워드로 바꿔라.

  규칙:
  - 대명사·생략된 주어는 "이전 대화"를 참고해 구체적인 명사로 채워라(예: "그거 언제까지야?"
    -> 직전에 언급된 대상 이름으로).
  - 인사말·군더더기 표현은 빼고 검색에 필요한 핵심 명사·키워드만 남겨라.
  - 한국어로, 한 줄로만 답하라. 설명이나 따옴표를 붙이지 마라.

