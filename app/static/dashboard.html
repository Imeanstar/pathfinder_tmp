<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AJOU Pathfinder — 로드맵</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <a href="/index.html" style="display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none">
        <img src="/ajou-logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">AJOU PATHFINDER</span>
      </a>
      <span class="header-context" id="headerContext"></span>
    </div>
    <div class="header-right">
      <button class="btn-ghost" id="restartBtn">처음부터</button>
      <div class="auth-slot" id="authSlot"></div>
    </div>
  </header>

  <main class="dashboard-grid">
    <section class="col" id="statusCol">
      <div class="card" id="creditCard"></div>
    </section>

    <section class="col" id="roadmapCol">
      <div class="card" id="roadmapCard"></div>
    </section>

    <section class="col" id="competencyCol">
      <div class="card" id="competencyCard"></div>
    </section>
  </main>

  <section class="chat-col" id="chatPanel" role="dialog" aria-modal="false" aria-labelledby="chatTitle" aria-hidden="true">
      <div class="card" id="chatCard">
        <div class="chat-head"><span id="chatTitle">상담</span><span class="sub">확인된 근거로만 안내해요</span><button class="chat-close" id="chatClose" aria-label="상담 닫기">✕</button></div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-chips" id="chatChips"></div>
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="답변을 입력하세요" rows="1"></textarea>
          <button id="chatSend">↑</button>
        </div>
        <div class="guardrail-status">
          <span id="guardrailLabel">가드레일 확인 중...</span>
          <button class="toggle-switch" id="guardrailToggle"></button>
        </div>
        <p class="disclaimer">
          졸업 여부를 확정하지 않습니다. 학사팀에 무엇을 확인해야 하는지를 특정해 드립니다.
        </p>
      </div>
  </section>

  <button class="chat-fab" id="chatFab" aria-label="상담 열기" aria-controls="chatPanel" aria-expanded="false"><span class="chat-fab-dots" aria-hidden="true">•••</span><strong>상담</strong></button>
  <nav class="mobile-tabbar" aria-label="대시보드 탐색">
    <button type="button" class="is-active" data-mobile-tab="status"><span>◷</span>현황</button>
    <button type="button" data-mobile-tab="roadmap"><span>⌁</span>로드맵</button>
    <button type="button" data-mobile-tab="skills"><span>◇</span>역량진단</button>
  </nav>

  <!-- 계정 드로어 — index.html/upload.html과 동일하되 [내 로드맵] 버튼은 없음
       (이미 로드맵 화면이라 불필요, 2026-08-24 사용자 요청). -->
  <div class="modal-overlay" id="drawerOverlay" hidden>
    <aside class="side-drawer">
      <button class="modal-close" id="drawerCloseBtn" aria-label="닫기">✕</button>
      <div class="drawer-account">
        <div class="drawer-avatar" id="drawerAvatar"></div>
        <div class="drawer-name" id="drawerName"></div>
        <div class="drawer-email" id="drawerEmail"></div>
      </div>
      <button class="drawer-logout" id="drawerLogoutBtn">로그아웃</button>
    </aside>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
