<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AJOU Pathfinder</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="landing-body">
  <header class="landing-header">
    <div class="landing-brand">
      <img src="/ajou-logo.svg" alt="" class="brand-logo" />
      <span>AJOU PATHFINDER</span>
    </div>
    <div class="auth-slot" id="authSlot"></div>
  </header>

  <main class="landing-main">
    <span class="landing-eyebrow">AJOU SOFTWARE · PERSONAL ROADMAP</span>
    <h1 class="landing-hero">
      졸업까지 <em>무엇을 듣고</em><br />
      <em>무엇에 참여할지</em><br />
      추천해 드립니다.
    </h1>

    <p class="landing-sub">
      성적표와 활동, 진로 목표를 함께 분석해<br />
      남은 학기에 필요한 과목과 교내 프로그램을 학기별로 정리합니다.
    </p>

    <ul class="landing-benefits" aria-label="서비스 주요 기능">
      <li><span>01</span> 이수 현황</li>
      <li><span>02</span> 역량 진단</li>
      <li><span>03</span> 학기별 로드맵</li>
    </ul>

    <button class="landing-cta" id="startBtn">시작하기 &nbsp;→</button>

    <p class="landing-trust">🔒 성적표 원본은 저장하지 않고, 이름·학번을 가린 뒤 분석합니다.</p>

    <div class="landing-or">또는</div>

    <p class="landing-resume">
      이미 정보를 입력하셨나요?
      <button class="link-btn" id="resumeBtn">내 로드맵 이어보기 →</button>
    </p>
  </main>

  <!-- 로그인 오버레이 — 구글 계정(@ajou.ac.kr 전용) 로그인(2026-08-21 신설) -->
  <div class="modal-overlay" id="loginOverlay" hidden>
    <div class="modal-card login-card">
      <button class="modal-close" id="loginCloseBtn" aria-label="닫기">✕</button>
      <img src="/ajou-logo.svg" alt="" class="modal-logo" />
      <h2 class="modal-title">로그인</h2>
      <p class="modal-sub">아주대학교 이메일(@ajou.ac.kr) 계정으로만<br />로그인할 수 있어요.</p>
      <div id="googleBtnSlot" class="google-btn-slot"></div>
      <p class="modal-error" id="loginError" hidden></p>
    </div>
  </div>

  <!-- 계정 드로어 — 로그인 상태에서 헤더의 계정 아이콘을 누르면 오른쪽에서 열림 -->
  <div class="modal-overlay" id="drawerOverlay" hidden>
    <aside class="side-drawer">
      <button class="modal-close" id="drawerCloseBtn" aria-label="닫기">✕</button>
      <div class="drawer-account">
        <div class="drawer-avatar" id="drawerAvatar"></div>
        <div class="drawer-name" id="drawerName"></div>
        <div class="drawer-email" id="drawerEmail"></div>
      </div>
      <button class="drawer-action" id="drawerMyRoadmapBtn">내 로드맵</button>
      <button class="drawer-logout" id="drawerLogoutBtn">로그아웃</button>
    </aside>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
