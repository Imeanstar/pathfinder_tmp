name: 요람 PDF 신선도

# 운영 자동화 계층 2(3.2장) — docs/superpowers/specs/2026-08-24-운영-자동화-design.md
#
# www.ajou.ac.kr robots.txt가 ClaudeBot·CCBot 등 AI 크롤러를 이름으로 차단하지만
# User-agent: *는 허용한다. 2026-08-24 사용자에게 이 사실을 공개하고 진행 승인을
# 받았다 — 연 1회뿐인 요청이라 부하 영향도 없다.
#
# graduation_requirements.json은 02_build_curriculum.py가 하드코딩이라 새 요람
# PDF를 봐도 자동으로 반영할 수 없다 — 이 워크플로우는 "PDF 자체를 요람/ 폴더에
# 받아두고, 사람이 재대조해야 한다"는 신호까지만 자동화한다.

on:
  schedule:
    - cron: "0 3 1 3 *" # 매년 3월 1일 03:00 UTC(정오경 KST, 신학기 개강 전후)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # urllib/re/html 표준 라이브러리만 쓴다 — pip install 불필요.

      - name: 신규 연도 확인
        id: check
        run: |
          year=$(python3 .github/scripts/yoram_freshness.py check)
          echo "year=$year" >> "$GITHUB_OUTPUT"

      - name: PDF 다운로드
        if: steps.check.outputs.year != ''
        run: |
          python3 .github/scripts/yoram_freshness.py download \
            "${{ steps.check.outputs.year }}" \
            "요람/${{ steps.check.outputs.year }} 요람.pdf"

      - name: PR 본문 생성
        if: steps.check.outputs.year != ''
        run: |
          {
            echo "## ⚠️ 새 학년도 요람 도착"
            echo ""
            echo "\`${{ steps.check.outputs.year }}학년도 소프트웨어융합대학 소프트웨어학과\` PDF를"
            echo "\`요람/${{ steps.check.outputs.year }} 요람.pdf\`로 받았습니다."
            echo ""
            echo "**graduation_requirements.json은 자동으로 갱신되지 않습니다**"
            echo "(\`data_pipeline/02_build_curriculum.py\`가 하드코딩 방식) — PDF 원문을 직접"
            echo "대조해서 졸업요건 데이터를 수동으로 갱신해주세요. 특히 과목명 개편"
            echo "(course_name_equivalents 대상)이 있는지 확인이 필요합니다."
          } > /tmp/pr_body.md

      # 자동 반영이 아니라 자동 PR — 새 학년도 요람이 도착했다는 사실만 자동으로
      # 알리고, JSON 갱신은 사람이 원문을 직접 보고 해야 한다(위 이유).
      - name: PR 생성
        if: steps.check.outputs.year != ''
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: ${{ steps.check.outputs.year }}학년도 요람 PDF 추가"
          title: "⚠️ ${{ steps.check.outputs.year }}학년도 요람 도착 — graduation_requirements.json 확인 필요"
          body-path: /tmp/pr_body.md
          branch: auto/yoram-freshness
          add-paths: 요람/
          delete-branch: true
