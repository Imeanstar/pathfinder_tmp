name: Deploy to Cloud Run

# CD(지속적 배포) — 계층 1 CI(ci.yml)가 성공했을 때만 자동으로 배포한다. 테스트가
# 깨지면 배포 자체가 안 일어나는 게 CI/CD의 핵심이라, 별도 워크플로우로 분리하고
# workflow_run으로 CI 성공을 조건으로 걸었다(같은 워크플로우에 몰아넣지 않음 —
# ci.yml은 PR에서도 돌아야 하는데 배포는 main에 실제로 반영됐을 때만 해야 하므로
# 트리거 조건 자체가 다르다).
#
# 인증은 Workload Identity Federation(키 없는 방식) — 서비스 계정 키(JSON)를 GitHub
# 시크릿으로 박아두는 대신, GitHub Actions가 매번 짧은 수명의 토큰만 발급받는다.
# WORKLOAD_IDENTITY_PROVIDER·SERVICE_ACCOUNT_EMAIL은 시크릿이 아니라 식별자일
# 뿐이라(실제 인증 주체는 GitHub OIDC 토큰 + 이 저장소로 범위가 제한된 바인딩)
# repository variable로 둔다.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # WIF가 GitHub OIDC 토큰을 발급받으려면 필요

env:
  SERVICE: ajou-pathfinder
  REGION: asia-northeast3
  PROJECT: proj-aj33-211200020328

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # CI가 검증한 바로 그 커밋을 배포한다(main의 "현재" 최신이 아니라) — 그 사이
      # 또 다른 커밋이 푸시됐다면 그건 다음 CI 실행이 따로 책임진다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: 배포
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$REGION" \
            --allow-unauthenticated \
            --memory 1Gi \
            --max-instances 5 \
            --set-env-vars GOOGLE_OAUTH_CLIENT_ID=783601922022-n6g99mfjumm2hquqk3aam6cv50l2dnpd.apps.googleusercontent.com,GIT_SHA=$(git rev-parse --short HEAD) \
            --set-secrets GOOGLE_API_KEY=GOOGLE_API_KEY:latest,EMAIL_HASH_PEPPER=EMAIL_HASH_PEPPER:latest \
            --quiet

      # 배포 직후 바로 스모크 테스트를 돌려 이 배포가 실제로 살아있는지 확인한다
      # (계층 3을 재사용 — 6시간 기다릴 필요 없이 배포마다 즉시 검증).
      - name: 배포 직후 스모크 테스트
        run: |
          python3 .github/scripts/smoke_test.py \
            "$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')" \
            "$(git rev-parse --short HEAD)"
